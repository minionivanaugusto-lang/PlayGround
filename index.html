<style>

der-radius:13px;border:1px solid #fff3;background:var(--panel);font-size:17px;box-shadow:0 7px 22px #101a1355;backdrop-filter:blur(12px)}.icon-btn:active,.action:active{transform:scale(.94)}.objective{position:absolute;top:77px;left:18px;padding:9px 13px;border-radius:12px;background:rgba(22,35,27,.74);border:1px solid #fff2;color:#dce4cb;font-size:11px;letter-spacing:.02em;backdrop-filter:blur(9px);display:flex;align-items:center;gap:8px}.objective b{color:var(--gold);font-weight:700}.bottom-ui{position:absolute;z-index:3;bottom:calc(16px + env(safe-area-inset-bottom));left:18px;right:18px;display:flex;align-items:flex-end;justify-content:space-between;pointer-events:none}.bottom-left,.bottom-right{pointer-events:auto}.card{background:var(--panel);border:1px solid #fff2;border-radius:17px;box-shadow:0 10px 28px #10201566;backdrop-filter:blur(14px)}.ant-card{min-width:205px;padding:12px 14px;display:flex;align-items:center;gap:11px}.ant-avatar{height:39px;width:39px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#eacb7b,#b5794d);font-size:23px}.ant-title{font-weight:750;font-size:12px}.ant-caption{font-size:10px;color:var(--muted);margin-top:3px}.status-dot{height:7px;width:7px;display:inline-block;border-radius:50%;background:#a6d378;margin-right:5px;box-shadow:0 0 8px #a6d378}.controls-hint{margin:8px 0 0 4px;color:#f3f1dfd9;font-size:10px;text-shadow:0 2px 6px #152219}.map-card{padding:7px;position:relative}.map-card canvas{position:relative;width:110px;height:72px;border-radius:11px;display:block}.map-label{position:absolute;top:-20px;right:3px;color:#e4e6d5aa;font-size:9px;letter-spacing:.16em;text-transform:uppercase}.zoom-controls{position:absolute;right:139px;bottom:0;display:flex;gap:6px}.zoom-controls button{width:38px;height:38px;border-radius:12px;background:var(--panel);border:1px solid #fff2;font-size:18px;box-shadow:0 5px 16px #10201555}.toast{position:absolute;left:50%;top:50%;z-index:5;transform:translate(-50%,-50%) translateY(10px);padding:11px 16px;background:#1a2a20ed;border:1px solid #fff3;border-radius:13px;box-shadow:0 10px 30px #1118;font-size:13px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,-50%)}.touch-controls{display:none;pointer-events:none}.joystick{pointer-events:auto;position:absolute;left:22px;bottom:calc(130px + env(safe-area-inset-bottom));width:108px;height:108px;border-radius:50%;border:1px solid #f2edbd42;background:#18261b88;box-shadow:inset 0 2px 14px #0004,0 6px 20px #1114;touch-action:none}.joy-knob{position:absolute;width:43px;height:43px;left:32px;top:32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f4db93,#b89758);box-shadow:0 4px 12px #1118;border:1px solid #fff6}.actions{display:flex;flex-direction:column;gap:9px;align-items:center;position:absolute;right:20px;bottom:calc(129px + env(safe-area-inset-bottom));pointer-events:auto}.action{width:56px;height:56px;border-radius:19px;background:var(--panel);border:1px solid #fff3;box-shadow:0 5px 18px #1115;font-size:22px;position:relative}.action span{position:absolute;bottom:-13px;left:0;right:0;font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:#f4eed0;white-space:nowrap}.action.primary{background:#e8c974;color:#3e3b26;border-color:#fff8}.mobile-note{display:none;position:absolute;bottom:calc(19px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:9px;color:#ffffffa8;letter-spacing:.06em;white-space:nowrap}
@media(max-width:700px){.topbar{top:calc(10px + env(safe-area-inset-top));left:10px;right:10px}.brand{gap:7px}.brand-icon{width:34px;height:34px;border-radius:11px;font-size:19px}.brand-name{font-size:16px}.brand-sub{font-size:8px}.hud-right{gap:5px}.resources{padding:4px;gap:2px}.resource{min-width:49px;gap:4px;padding:6px 5px}.resource-icon{font-size:14px}.resource-num{font-size:12px}.resource-label{font-size:7px}.icon-btn{width:34px;height:34px;border-radius:11px;font-size:14px}.objective{top:55px;left:10px;padding:7px 9px;font-size:9px}.bottom-ui{bottom:calc(12px + env(safe-area-inset-bottom));left:10px;right:10px}.ant-card{min-width:0;padding:8px 9px;gap:8px}.ant-avatar{width:32px;height:32px;border-radius:10px;font-size:18px}.ant-title{font-size:10px}.ant-caption{font-size:8px}.controls-hint{display:none}.map-card{padding:5px}.map-card canvas{width:77px;height:53px}.map-label{top:-15px;font-size:7px}.zoom-controls{right:96px}.zoom-controls button{width:31px;height:31px;border-radius:10px;font-size:16px}.touch-controls{display:block}.mobile-note{display:block}.joystick{width:94px;height:94px;left:15px;bottom:calc(110px + env(safe-area-inset-bottom))}.joy-knob{width:39px;height:39px;left:27px;top:27px}.actions{right:15px;bottom:calc(108px + env(safe-area-inset-bottom));gap:7px}.action{width:48px;height:48px;border-radius:16px;font-size:20px}.action span{font-size:7px}.}

<body>
<main class="game" id="game"><canvas id="world" aria-label="Mapa del bosque"></canvas><div class="vignette"></div>
<header class="topbar"><div class="brand"><div class="brand-icon">🐜</div><div><div class="brand-name">Pequeño mundo</div><div class="brand-sub">Crónicas de la colonia</div></div></div><div class="hud-right"><div class="resources"><div class="resource"><span class="resource-icon">🍃</span><div><span class="resource-num" id="leafCount">12</span><span class="resource-label">Hojas</span></div></div><div class="resource"><span class="resource-icon">🫐</span><div><span class="resource-num" id="berryCount">4</span><span class="resource-label">Bayas</span></div></div><div class="resource"><span class="resource-icon">🌰</span><div><span class="resource-num" id="seedCount">7</span><span class="resource-label">Semillas</span></div></div></div><button class="icon-btn" id="soundBtn" aria-label="Sonido">♫</button><button class="icon-btn" id="pauseBtn" aria-label="Pausar">Ⅱ</button></div></header>
<div class="objective"><span>✦</span><span>Explorá el claro y <b>reuní recursos</b></span></div>
<div class="bottom-ui"><div class="bottom-left"><div class="card ant-card"><div class="ant-avatar">🐜</div><div><div class="ant-title">Exploradora <span style="color:#a6c76b">·</span></div><div class="ant-caption"><i class="status-dot"></i><span id="antStatus">Lista para explorar</span></div></div></div><div class="controls-hint">Tocá el suelo para mover · arrastrá para explorar</div></div><div class="bottom-right"><div class="map-label">Tu claro</div><div class="card map-card"><canvas id="minimap"></canvas></div></div><div class="zoom-controls"><button id="zoomOut" aria-label="Alejar">−</button><button id="zoomIn" aria-label="Acercar">+</button></div></div>
<div class="touch-controls"><div class="joystick" id="joystick"><div class="joy-knob" id="joyKnob"></div></div><div class="actions"><button class="action primary" id="gatherBtn">✦<span>Recolectar</span></button><button class="action" id="homeBtn">⌂<span>Colonia</span></button></div><div class="mobile-note">MANTENÉ PARA CAMINAR · TOCÁ EL MAPA PARA MARCAR DESTINO</div></div><div class="toast" id="toast"></div></main>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#world'),ctx=canvas.getContext('2d'),mini=document.querySelector('#minimap'),mctx=mini.getContext('2d');
const W=2600,H=1900,TAU=Math.PI*2;let dpr=1,cw=0,ch=0,zoom=1,paused=false,sound=true,toastTimer, last=performance.now();
const cam={x:W/2,y:H/2},ant={x:W/2-30,y:H/2+20,vx:0,vy:0,angle:0,tx:null,ty:null,walk:0};let stick={x:0,y:0,active:false,pointer:null};let inventory={leaf:12,berry:4,seed:7};
let randSeed=87412;function rnd(){randSeed=(randSeed*1664525+1013904223)>>>0;return randSeed/4294967296}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function dist(a,b,x,y){return Math.hypot(a-x,b-y)}
const features=[],plants=[],pebbles=[],grass=[];
function makeFeature(type,x,y,size,variant=0){features.push({type,x,y,size,variant,phase:rnd()*TAU})}
// Soft, painterly ground details are fixed to the world so the landscape feels alive.
for(let i=0;i<1800;i++)grass.push({x:rnd()*W,y:rnd()*H,r:1+rnd()*3,a:.045+rnd()*.12,c:rnd()});
// A winding dirt path links the colony entrance to the open central meadow.
const pathPoints=[{x:W*.52,y:H*.53},{x:W*.55,y:H*.48},{x:W*.51,y:H*.43},{x:W*.47,y:H*.38},{x:W*.51,y:H*.34},{x:W*.56,y:H*.31}];const pathSpecks=Array.from({length:180},(_,i)=>{let t=rnd(),x=W*.52+(t-.5)*760;return{x,y:yForX(x)+(rnd()-.5)*60,r:2+rnd()*4,a:.13+rnd()*.13,c:i%3}});
function pathY(x){let best=1e9;for(let i=0;i<pathPoints.length-1;i++){let a=pathPoints[i],b=pathPoints[i+1],t=clamp(((x-a.x)*(b.x-a.x)+(yForX(x)-a.y)*(b.y-a.y))/((b.x-a.x)**2+(b.y-a.y)**2),0,1);best=Math.min(best,dist(x,yForX(x),a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t))}return best}
function yForX(x){return H*.5+(x-W*.52)*-.66+Math.sin(x*.006)*55}
for(let i=0;i<75;i++){let side=i%4, x,y;if(side===0){x=rnd()*W;y=rnd()*H*.19}else if(side===1){x=rnd()*W;y=H*(.81+rnd()*.19)}else if(side===2){x=rnd()*W*.16;y=rnd()*H}else{x=W*(.84+rnd()*.16);y=rnd()*H}if(pathY(x)>90)makeFeature('tree',x,y,42+rnd()*35,Math.floor(rnd()*4))}
// Stones cluster around the edges; the central clearing stays readable.
for(let i=0;i<125;i++){let x=rnd()*W,y=rnd()*H;if(pathY(x)>135&&dist(x,y,W*.52,H*.43)>330)makeFeature('tree',x,y,38+rnd()*36,Math.floor(rnd()*4))}
for(let i=0;i<100;i++){let x=rnd()*W,y=rnd()*H;if(dist(x,y,W*.52,H*.43)>210&&pathY(x)>55)makeFeature('rock',x,y,13+rnd()*25,Math.floor(rnd()*3))}
for(let i=0;i<58;i++){let x=160+rnd()*(W-320),y=130+rnd()*(H-260);if(pathY(x)<85||features.some(f=>f.type==='tree'&&dist(x,y,f.x,f.y)<100))continue;const kind=['berry','seed','leaf'][Math.floor(rnd()*3)];plants.push({x,y,kind,amount:kind==='berry'?2:kind==='seed'?3:2,phase:rnd()*TAU,size:10+rnd()*8})}
for(let i=0;i<180;i++){let x=rnd()*W,y=rnd()*H;if(pathY(x)>80)pebbles.push({x,y,r:2+rnd()*5,shade:rnd()})}
function resize(){dpr=Math.min(devicePixelRatio||1,2);const r=canvas.getBoundingClientRect();cw=r.width;ch=r.height;canvas.width=Math.floor(cw*dpr);canvas.height=Math.floor(ch*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);mini.width=220*dpr;mini.height=144*dpr;mini.style.width='110px';mini.style.height='72px';mctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);resize();
function screenToWorld(sx,sy){return{x:cam.x+(sx-cw/2)/zoom,y:cam.y+(sy-ch/2)/zoom}}
function worldToScreen(x,y){return{x:(x-cam.x)*zoom+cw/2,y:(y-cam.y)*zoom+ch/2}}
function roundedRect(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
function drawGround(){ctx.fillStyle='#64824b';ctx.fillRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,W*.8,H);g.addColorStop(0,'#78945a');g.addColorStop(.52,'#829b5f');g.addColorStop(1,'#597b48');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
// irregular meadow light patches
for(let i=0;i<22;i++){let x=(i*347+170)%W,y=(i*571+110)%H;ctx.fillStyle=i%2?'rgba(181,182,112,.055)':'rgba(46,94,58,.07)';ctx.beginPath();ctx.ellipse(x,y,150+(i%5)*30,60+(i%4)*19,i*.7,0,TAU);ctx.fill()}
for(const p of grass){ctx.globalAlpha=p.a;ctx.fillStyle=p.c>.5?'#d8d694':'#294f39';ctx.beginPath();ctx.ellipse(p.x,p.y,p.r,p.r*.48,p.c*3,0,TAU);ctx.fill()}ctx.globalAlpha=1;
// softly banked, curving earth trail
ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();pathPoints.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle='#536544';ctx.lineWidth=106;ctx.stroke();ctx.beginPath();pathPoints.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle='#b49b69';ctx.lineWidth=92;ctx.stroke();ctx.beginPath();pathPoints.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle='#c2ab78';ctx.lineWidth=74;ctx.stroke();
// faint tracks and soil speckles along the path
for(const p of pathSpecks){ctx.fillStyle=p.c?'#7d7954':'#e2cb91';ctx.globalAlpha=p.a;ctx.beginPath();ctx.ellipse(p.x,p.y,p.r,p.r*.48,p.x*.013,0,TAU);ctx.fill()}ctx.globalAlpha=1;
// colony mound at the trail's beginning
const hx=W*.52,hy=H*.535;ctx.fillStyle='#455a38';ctx.beginPath();ctx.ellipse(hx,hy+20,94,49,0,0,TAU);ctx.fill();let mound=ctx.createRadialGradient(hx-20,hy-19,4,hx,hy,94);mound.addColorStop(0,'#d7c18b');mound.addColorStop(.8,'#987850');mound.addColorStop(1,'#6b6245');ctx.fillStyle=mound;ctx.beginPath();ctx.ellipse(hx,hy,86,42,-.08,0,TAU);ctx.fill();ctx.fillStyle='#392d25';ctx.beginPath();ctx.ellipse(hx-9,hy+4,25,11,-.14,0,TAU);ctx.fill();ctx.strokeStyle='#d5bc83';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(hx-9,hy+3,28,13,-.14,Math.PI,TAU);ctx.stroke();ctx.fillStyle='#e7d59d';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText('COLONIA',hx,hy-59);ctx.textAlign='start';}
function drawTree(f,time){let {x,y,size:s,variant:v}=f;ctx.save();ctx.translate(x,y);ctx.fillStyle='#283e2c55';ctx.beginPath();ctx.ellipse(8,s*.72,s*.85,s*.3,-.25,0,TAU);ctx.fill();ctx.fillStyle=['#5f4832','#655039','#594732','#75583a'][v];ctx.beginPath();ctx.moveTo(-s*.12,s*.48);ctx.lineTo(-s*.08,-s*.44);ctx.lineTo(s*.16,-s*.44);ctx.lineTo(s*.2,s*.52);ctx.fill();let greens=[['#496b3d','#63834c','#78915a'],['#355d3d','#4d7447','#6a8b53'],['#557344','#718d50','#8d9d5a'],['#3f6849','#608456','#82985b']][v];
for(let i=0;i<3;i++){let ox=[-.36,.28,0][i]*s,oy=[-.22,-.3,-.58][i]*s,r=[.61,.62,.7][i]*s;ctx.fillStyle='#203b2e44';ctx.beginPath();ctx.ellipse(ox+5,oy+r*.72,r*.9,r*.3,0,0,TAU);ctx.fill();ctx.fillStyle=greens[i];ctx.beginPath();ctx.arc(ox,oy,r,0,TAU);ctx.fill();ctx.fillStyle='#ffffff12';ctx.beginPath();ctx.arc(ox-r*.25,oy-r*.28,r*.55,3.7,5.3);ctx.fill();}
// a few distinct leaves give each canopy a hand-painted silhouette
ctx.fillStyle=greens[2];for(let i=0;i<5;i++){let a=f.phase+i*1.3,px=Math.cos(a)*s*.55,py=-s*.48+Math.sin(a)*s*.4;ctx.beginPath();ctx.ellipse(px,py,s*.14,s*.06,a,0,TAU);ctx.fill()}ctx.restore()}
function drawRock(f){let {x,y,size:s,variant:v}=f;ctx.save();ctx.translate(x,y);ctx.fillStyle='#263a2b55';ctx.beginPath();ctx.ellipse(3,s*.48,s*.92,s*.36,0,0,TAU);ctx.fill();ctx.fillStyle=['#828878','#9c9b89','#777e76'][v];ctx.beginPath();ctx.moveTo(-s*.8,s*.26);ctx.lineTo(-s*.55,-s*.38);ctx.lineTo(-s*.08,-s*.72);ctx.lineTo(s*.58,-s*.47);ctx.lineTo(s*.82,s*.12);ctx.lineTo(s*.34,s*.55);ctx.lineTo(-s*.44,s*.52);ctx.closePath();ctx.fill();ctx.fillStyle='#ffffff2b';ctx.beginPath();ctx.moveTo(-s*.55,-s*.38);ctx.lineTo(-s*.08,-s*.72);ctx.lineTo(s*.58,-s*.47);ctx.lineTo(s*.1,-s*.2);ctx.closePath();ctx.fill();ctx.strokeStyle='#4f5c50';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-s*.4,s*.13);ctx.lineTo(-s*.1,-s*.12);ctx.lineTo(s*.12,s*.07);ctx.stroke();ctx.restore()}
function drawPlant(p,time){if(!p.amount)return;ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle='#253d2e55';ctx.beginPath();ctx.ellipse(0,7,p.size*1.05,5,0,0,TAU);ctx.fill();ctx.strokeStyle='#426941';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,6);ctx.quadraticCurveTo(-3,-7,0,-13);ctx.moveTo(-1,-1);ctx.quadraticCurveTo(-11,-9,-14,-8);ctx.moveTo(1,1);ctx.quadraticCurveTo(10,-10,14,-7);ctx.stroke();ctx.fillStyle='#83a75a';ctx.beginPath();ctx.ellipse(-11,-8,7,3,-.5,0,TAU);ctx.ellipse(11,-8,7,3,.5,0,TAU);ctx.fill();if(p.kind==='berry'){for(let i=0;i<p.amount;i++){let a=i*2.2+p.phase;ctx.fillStyle=i%2?'#9b4860':'#b95869';ctx.beginPath();ctx.arc(Math.cos(a)*8,-14+Math.sin(a)*2,4.7,0,TAU);ctx.fill();ctx.fillStyle='#fff9';ctx.beginPath();ctx.arc(Math.cos(a)*8-1,-15+Math.sin(a)*2,1.2,0,TAU);ctx.fill()}}else if(p.kind==='seed'){for(let i=0;i<p.amount;i++){ctx.save();ctx.translate((i-1)*6,-8);ctx.rotate(-.5+i*.38);ctx.fillStyle='#d9b866';ctx.beginPath();ctx.ellipse(0,0,3.7,6,0,0,TAU);ctx.fill();ctx.restore()}}else{ctx.fillStyle='#d9cf89';ctx.beginPath();ctx.ellipse(0,-12,7,3,-.6,0,TAU);ctx.fill()}if(p.amount<2){ctx.globalAlpha=.5;ctx.fillStyle='#f0da8d';ctx.beginPath();ctx.arc(0,-23,8,0,TAU);ctx.fill()}ctx.restore()}
function drawAnt(time){let x=ant.x,y=ant.y;ctx.save();ctx.translate(x,y);ctx.rotate(ant.angle);let moving=Math.hypot(ant.vx,ant.vy)>.3;let wiggle=moving?Math.sin(time*.018)*2:Math.sin(time*.003)*.5;ctx.strokeStyle='#38251e';ctx.lineWidth=2;ctx.lineCap='round';for(let side of [-1,1]){for(let i=0;i<3;i++){let px=(i-1)*5;ctx.beginPath();ctx.moveTo(px,side*2);ctx.lineTo(px+Math.sin(time*.02+i*2+side)*2,side*(7+wiggle));ctx.lineTo(px+3,side*11);ctx.stroke()}}ctx.fillStyle='#39251d';ctx.beginPath();ctx.ellipse(-7,0,5,4.2,0,0,TAU);ctx.fill();ctx.beginPath();ctx.ellipse(0,0,4.4,3.6,0,0,TAU);ctx.fill();ctx.fillStyle='#4c2b21';ctx.beginPath();ctx.arc(7,0,4.3,0,TAU);ctx.fill();ctx.fillStyle='#f5deb1';ctx.beginPath();ctx.arc(8.7,-1.2,1,0,TAU);ctx.fill();ctx.strokeStyle='#39251d';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(9,-2);ctx.quadraticCurveTo(13,-8,16,-7);ctx.moveTo(8,-2);ctx.quadraticCurveTo(10,-8,13,-10);ctx.stroke();ctx.restore();
// soft marker and target ring
ctx.fillStyle='#17281844';ctx.beginPath();ctx.ellipse(x,y+12,12,4,0,0,TAU);ctx.fill();if(ant.tx!==null){ctx.strokeStyle='#f1d88b99';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ant.tx,ant.ty,10+Math.sin(time*.007)*2,0,TAU);ctx.stroke();ctx.fillStyle='#f4dd9d99';ctx.beginPath();ctx.arc(ant.tx,ant.ty,2.4,0,TAU);ctx.fill()}}
function drawScene(time){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cw,ch);ctx.save();ctx.translate(cw/2,ch/2);ctx.scale(zoom,zoom);ctx.translate(-cam.x,-cam.y);drawGround();const sorted=features.concat(plants.filter(p=>p.amount)).sort((a,b)=>a.y-b.y);for(const f of sorted){if(f.type==='tree')drawTree(f,time);else if(f.type==='rock')drawRock(f);else drawPlant(f,time)}for(const r of pebbles){ctx.fillStyle=r.shade>.5?'#b8b59a99':'#4b624688';ctx.beginPath();ctx.ellipse(r.x,r.y,r.r,r.r*.62,r.shade,0,TAU);ctx.fill()}drawAnt(time);ctx.restore();drawMini();}
function drawMini(){const mw=110,mh=72;mctx.setTransform(dpr,0,0,dpr,0,0);mctx.clearRect(0,0,mw,mh);mctx.fillStyle='#698754';mctx.fillRect(0,0,mw,mh);mctx.strokeStyle='#b9a577';mctx.lineWidth=3;mctx.lineCap='round';mctx.beginPath();pathPoints.forEach((p,i)=>{let x=p.x/W*mw,y=p.y/H*mh;i?mctx.lineTo(x,y):mctx.moveTo(x,y)});mctx.stroke();for(const f of features){if(f.type==='tree'){mctx.fillStyle='#31543b';mctx.beginPath();mctx.arc(f.x/W*mw,f.y/H*mh,1.3,0,TAU);mctx.fill()}}for(const p of plants){if(!p.amount)continue;mctx.fillStyle=p.kind==='berry'?'#d57c78':p.kind==='seed'?'#ebd081':'#b8d28a';mctx.fillRect(p.x/W*mw,p.y/H*mh,1.7,1.7)}mctx.fillStyle='#f2d578';mctx.beginPath();mctx.arc(ant.x/W*mw,ant.y/H*mh,2.5,0,TAU);mctx.fill();const vw=Math.min(mw,cw/(zoom*W)*mw),vh=Math.min(mh,ch/(zoom*H)*mh);mctx.strokeStyle='#fff9';mctx.lineWidth=.8;mctx.strokeRect(clamp(cam.x/W*mw-vw/2,0,mw-vw),clamp(cam.y/H*mh-vh/2,0,mh-vh),vw,vh)}
function setStatus(text){document.querySelector('#antStatus').textContent=text}
function showToast(text){let el=document.querySelector('#toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1750)}
function setTarget(x,y){ant.tx=clamp(x,35,W-35);ant.ty=clamp(y,35,H-35);setStatus('Caminando hacia allí')}
function nearestPlant(max=420){let best=null,bd=max;for(const p of plants){if(!p.amount)continue;let d=dist(ant.x,ant.y,p.x,p.y);if(d<bd){bd=d;best=p}}return best}
function gather(){let p=nearestPlant(700);if(!p){showToast('No hay recursos cerca');return}if(dist(ant.x,ant.y,p.x,p.y)<34){collect(p);return}setTarget(p.x,p.y);showToast('¡Vamos por '+({berry:'bayas',seed:'semillas',leaf:'hojas'}[p.kind])+'!')}
function collect(p){if(!p.amount)return;p.amount--;inventory[p.kind]+=p.kind==='berry'?1:p.kind==='seed'?2:1;updateHud();setStatus('¡Recurso recolectado!');showToast(({berry:'🫐 ¡Baya recolectada!',seed:'🌰 ¡Semillas recolectadas!',leaf:'🍃 ¡Hojas recolectadas!'}[p.kind]));if(!p.amount)setTimeout(()=>{p.amount=p.kind==='seed'?3:2},12000)}
function updateHud(){document.querySelector('#leafCount').textContent=inventory.leaf;document.querySelector('#berryCount').textContent=inventory.berry;document.querySelector('#seedCount').textContent=inventory.seed}
function blocked(x,y){for(const f of features){let r=f.type==='tree'?f.size*.58:f.size*.75;if(dist(x,y,f.x,f.y)<r+7)return true}return false}
function update(dt,time){if(paused)return;let ix=stick.x,iy=stick.y;let keys=window.keys||{};if(keys.ArrowLeft||keys.a)ix-=1;if(keys.ArrowRight||keys.d)ix+=1;if(keys.ArrowUp||keys.w)iy-=1;if(keys.ArrowDown||keys.s)iy+=1;let mag=Math.hypot(ix,iy);if(mag>1){ix/=mag;iy/=mag}
if(mag>.08){ant.tx=null;ant.vx=ix*145;ant.vy=iy*145;ant.angle=Math.atan2(iy,ix);setStatus('Explorando el claro')}else if(ant.tx!==null){let dx=ant.tx-ant.x,dy=ant.ty-ant.y,d=Math.hypot(dx,dy);if(d<8){ant.x=ant.tx;ant.y=ant.ty;ant.tx=null;ant.vx=ant.vy=0;setStatus('Lista para explorar')}else{ant.vx=dx/d*112;ant.vy=dy/d*112;ant.angle=Math.atan2(dy,dx)}}else{ant.vx*=.8;ant.vy*=.8}
const nx=clamp(ant.x+ant.vx*dt,12,W-12),ny=clamp(ant.y+ant.vy*dt,12,H-12);if(!blocked(nx,ny)){ant.x=nx;ant.y=ny}else{if(!blocked(nx,ant.y))ant.x=nx;if(!blocked(ant.x,ny))ant.y=ny;if(ant.tx!==null&&blocked(nx,ny)){ant.tx=null;setStatus('Lista para explorar')}}if(Math.hypot(ant.vx,ant.vy)>3)ant.walk+=dt*9;
for(const p of plants){if(p.amount&&dist(ant.x,ant.y,p.x,p.y)<23)collect(p)}const lookX=ant.x+(ant.tx!==null?(ant.tx-ant.x)*.18:0),lookY=ant.y+(ant.ty!==null?(ant.ty-ant.y)*.18:0);cam.x+=(clamp(lookX,cw/(2*zoom),W-cw/(2*zoom))-cam.x)*Math.min(1,dt*3.4);cam.y+=(clamp(lookY,ch/(2*zoom),H-ch/(2*zoom))-cam.y)*Math.min(1,dt*3.4)}
function frame(now){let dt=Math.min(.04,(now-last)/1000);last=now;update(dt,now);drawScene(now);requestAnimationFrame(frame)}requestAnimationFrame(frame);
window.keys={};window.addEventListener('keydown',e=>{window.keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key===' '){paused=!paused;document.querySelector('#pauseBtn').textContent=paused?'▶':'Ⅱ'}});window.addEventListener('keyup',e=>window.keys[e.key]=false);
let down=null;canvas.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;canvas.setPointerCapture(e.pointerId);down={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false};});canvas.addEventListener('pointermove',e=>{if(!down)return;let dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.hypot(dx,dy)>8)down.moved=true;if(down.moved){cam.x=clamp(down.cx-dx/zoom,cw/(2*zoom),W-cw/(2*zoom));cam.y=clamp(down.cy-dy/zoom,ch/(2*zoom),H-ch/(2*zoom))}});canvas.addEventListener('pointerup',e=>{if(!down)return;if(!down.moved){let r=canvas.getBoundingClientRect(),p=screenToWorld(e.clientX-r.left,e.clientY-r.top);setTarget(p.x,p.y)}down=null});canvas.addEventListener('wheel',e=>{zoom=clamp(zoom+(e.deltaY<0?.12:-.12),.65,1.65);e.preventDefault()},{passive:false});
document.querySelector('#zoomIn').onclick=()=>zoom=clamp(zoom+.15,.65,1.65);document.querySelector('#zoomOut').onclick=()=>zoom=clamp(zoom-.15,.65,1.65);document.querySelector('#pauseBtn').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'▶':'Ⅱ';showToast(paused?'Partida en pausa':'¡A explorar!')};document.querySelector('#soundBtn').onclick=e=>{sound=!sound;e.currentTarget.textContent=sound?'♫':'♪';showToast(sound?'Sonido activado':'Sonido silenciado')};document.querySelector('#gatherBtn').onclick=gather;document.querySelector('#homeBtn').onclick=()=>{setTarget(W*.52,H*.535);showToast('Volviendo a la colonia')};
// Simple, finger-sized virtual joystick; touch never scrolls the page.
const joystick=document.querySelector('#joystick'),knob=document.querySelector('#joyKnob');function joyMove(e){let r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.31,d=Math.hypot(dx,dy);if(d>max){dx*=max/d;dy*=max/d}stick.x=dx/max;stick.y=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`}function joyEnd(){stick.x=stick.y=0;stick.active=false;stick.pointer=null;knob.style.transform='translate(0,0)'}joystick.addEventListener('pointerdown',e=>{e.preventDefault();joystick.setPointerCapture(e.pointerId);stick.active=true;stick.pointer=e.pointerId;joyMove(e)});joystick.addEventListener('pointermove',e=>{if(stick.active&&e.pointerId===stick.pointer)joyMove(e)});joystick.addEventListener('pointerup',joyEnd);joystick.addEventListener('pointercancel',joyEnd);
mini.addEventListener('pointerdown',e=>{let r=mini.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;setTarget(x,y)});
})();
</script></body></html>
